<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel WhatsAYA</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('whatsaya_theme');
        var d = s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/regular/rounded.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/contacts.css">
  <link rel="stylesheet" href="/static/atendimento.css">
  <link rel="stylesheet" href="/static/management.css">
  <script type="importmap">
    {
      "imports": {
        "preact": "https://cdn.jsdelivr.net/npm/preact@10.24.3/+esm",
        "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.24.3/hooks/+esm",
        "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="app"><div class="boot">Carregando painel…</div></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
