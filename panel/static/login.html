<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Login · Therapify</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-status-pill" aria-label="Status do sistema">
      <span class="dot" aria-hidden="true"></span>
      <span>Sistema operacional · WhatsAYA</span>
    </div>

    <div class="login-card">
      <div class="login-brand-row">
        <div class="login-brand-mark" id="brand-mark-wrap" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" id="default-brand-svg">
            <path d="M2 20L7.5 4l5.5 16" stroke="#070B0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.4 14.5h6.2" stroke="#070B0D" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M18.2 12.2V20" stroke="#070B0D" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M22 4l-3.8 8.2" stroke="#070B0D" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M14.4 4l3.8 8.2" stroke="#F26E22" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="login-brand-title">
          <span id="brand-title-text">Therapify</span><span class="dot">.</span>
        </div>
      </div>

      <header class="login-header">
        <div class="eyebrow">Acesso Restrito</div>
        <h1>Entrar no painel</h1>
        <p>Informe suas credenciais para gerenciar leads, agendamentos e atendimentos.</p>
      </header>

      <div id="alert-box" class="login-alert error" role="alert" style="display: none;">
        <svg id="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="alert-text">Credenciais inválidas.</span>
      </div>

      <form id="login-form" action="/api/login" method="POST" novalidate>
        <div class="field-group">
          <label for="username">Usuário de acesso</label>
          <div class="input-wrap">
            <span class="input-icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="admin"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              inputmode="text"
              autofocus
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <span class="input-icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              required
            />
            <button
              type="button"
              id="toggle-password"
              class="toggle-pwd-btn"
              aria-label="Mostrar ou ocultar senha"
              title="Mostrar senha"
            >
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label for="remember">
            <input type="checkbox" name="remember" id="remember" checked />
            <span>Lembrar neste dispositivo</span>
          </label>
          <span title="Sessão com autenticação persistida">30 dias</span>
        </div>

        <button type="submit" id="submit-btn" class="login-submit-btn">
          <span id="btn-text">Acessar painel</span>
          <svg id="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <footer class="login-card-footer">
        <div class="login-security-tag">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Acesso seguro com criptografia</span>
        </div>
        <span>WhatsAYA</span>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');
      const alertBox = document.getElementById('alert-box');
      const alertText = document.getElementById('alert-text');
      const userInput = document.getElementById('username');
      const pwdInput = document.getElementById('password');
      const togglePwdBtn = document.getElementById('toggle-password');
      const eyeOpen = togglePwdBtn.querySelector('.eye-open');
      const eyeClosed = togglePwdBtn.querySelector('.eye-closed');

      // Buscar configuração pública (marca, logo)
      fetch('/api/public-config')
        .then(function (res) { return res.json(); })
        .then(function (cfg) {
          if (cfg && cfg.brand) {
            document.title = 'Login · ' + cfg.brand;
            const brandTitleEl = document.getElementById('brand-title-text');
            if (brandTitleEl) brandTitleEl.textContent = cfg.brand;
          }
          if (cfg && cfg.theme && cfg.theme.logo) {
            const wrap = document.getElementById('brand-mark-wrap');
            if (wrap) {
              wrap.innerHTML = '<img src="' + cfg.theme.logo + '" alt="' + (cfg.brand || '') + '">';
            }
          }
        })
        .catch(function () {});

      // Parâmetros da URL para mensagens automáticas
      var params = new URLSearchParams(location.search);
      if (params.get('error')) {
        showAlert('Usuário ou senha incorretos. Por favor, tente novamente.', 'error');
      } else if (params.get('expired')) {
        showAlert('Sua sessão expirou por inatividade. Faça login novamente.', 'error');
      } else if (params.get('logged_out')) {
        showAlert('Você saiu do painel com segurança.', 'success');
      }

      function showAlert(msg, type) {
        alertText.textContent = msg;
        alertBox.className = 'login-alert ' + (type === 'success' ? 'success' : 'error');
        alertBox.style.display = 'flex';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Alternar visibilidade de senha
      togglePwdBtn.addEventListener('click', function () {
        var isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        eyeOpen.style.display = isPwd ? 'none' : 'block';
        eyeClosed.style.display = isPwd ? 'block' : 'none';
        togglePwdBtn.title = isPwd ? 'Ocultar senha' : 'Mostrar senha';
      });

      // Submit assíncrono
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlert();

        var username = (userInput.value || '').trim();
        var password = pwdInput.value || '';

        if (!username || !password) {
          showAlert('Preencha o usuário e a senha para prosseguir.', 'error');
          if (!username) userInput.focus();
          else pwdInput.focus();
          return;
        }

        // Estado carregando
        submitBtn.disabled = true;
        btnText.textContent = 'Autenticando…';
        btnIcon.outerHTML = '<span id="btn-icon" class="login-spinner" aria-hidden="true"></span>';

        try {
          var res = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ username: username, password: password })
          });

          var data = {};
          try { data = await res.json(); } catch (_) {}

          if (res.ok && data.ok) {
            var next = params.get('next') || data.redirect || '/';
            location.href = next;
            return;
          }

          var msg = (data && data.error) || 'Credenciais inválidas. Verifique o usuário e a senha.';
          showAlert(msg, 'error');
          pwdInput.value = '';
          pwdInput.focus();
        } catch (err) {
          showAlert('Falha na comunicação com o servidor. Tente novamente.', 'error');
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = 'Acessar painel';
          var currentIcon = document.getElementById('btn-icon');
          if (currentIcon) {
            currentIcon.outerHTML = '<svg id="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
          }
        }
      });
    })();
  </script>
</body>
</html>
