name: Plugin outbound

on:
  pull_request:
  push:
    branches: [main]

jobs:
  outbound-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest tests.test_outbound_spacing tests.test_citation tests.test_whatsapp_audio_history -q
