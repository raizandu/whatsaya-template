<!doctype html>
<!-- @dsCard group="Components" name="Components · Radio" subtitle="input nativo estilizado · off · selected · hover · focus · disabled · grupo de escolha única · claro + escuro" viewport="760x520" -->
<html><head><meta charset="utf-8"><title>Radio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;font-family:var(--font-sans);}
  body{background:var(--background);display:grid;grid-template-columns:1fr 1fr;}
  .panel{padding:24px;background:var(--background);color:var(--foreground);}
  .panel-head{display:flex;align-items:center;gap:8px;margin:0 0 16px;font:700 11px/1 var(--font-sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--foreground-50);}
  .panel-head .marker{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--primary);}
  .group{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius-lg);background:var(--card);box-shadow:var(--shadow-hairline);margin-bottom:14px;}
  .col-h{font:600 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--foreground-50);margin:0 0 4px;}
  .row{display:flex;align-items:center;gap:10px;min-height:24px;}
  .lbl{font:600 14px/20px var(--font-sans);color:var(--foreground);cursor:pointer;}
  .lbl small{display:block;font:400 12px/16px var(--font-sans);color:var(--muted-foreground);}
  .row:has(input:disabled) .lbl{color:var(--muted-foreground);cursor:not-allowed;}

  /* .radio — <input type="radio"> com appearance:none; ponto interno em --primary-foreground */
  .radio{
    appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer;
    width:16px;height:16px;border-radius:var(--radius-pill);
    border:1px solid var(--hairline-strong);background:var(--input-bg);
    display:grid;place-content:center;
    transition:background-color var(--duration-base) var(--ease-hover),border-color var(--duration-base) var(--ease-hover),box-shadow var(--duration-base) var(--ease-hover);
  }
  .radio::before{
    content:"";width:6px;height:6px;border-radius:var(--radius-pill);background:var(--primary-foreground);
    transform:scale(0);transition:transform var(--duration-fast) var(--ease-out);
  }
  .radio:hover,.radio.is-hover{border-color:var(--foreground-75);}
  .radio:checked{background:var(--primary);border-color:var(--primary-edge);}
  .radio:checked::before{transform:scale(1);}
  .radio:checked:hover{background:var(--primary-hover);}
  .radio:active:not(:disabled){background:var(--primary-active);}
  .radio:focus-visible,.radio.is-focus{outline:none;box-shadow:var(--focus-ring);}
  .radio:disabled{opacity:.5;cursor:not-allowed;background:var(--muted-solid);border-color:var(--border-solid);}
  .radio:disabled:checked{background:var(--muted-foreground);border-color:var(--muted-foreground);}
</style></head>
<body>

<div class="panel light">
  <div class="panel-head"><span class="marker"></span> Tema claro</div>
  <div class="group">
    <div class="col-h">Estados</div>
    <label class="row"><input type="radio" class="radio" name="sl"><span class="lbl">Off</span></label>
    <label class="row"><input type="radio" class="radio is-hover" name="sl2"><span class="lbl">Hover</span></label>
    <label class="row"><input type="radio" class="radio" name="sl3" checked><span class="lbl">Selected</span></label>
    <label class="row"><input type="radio" class="radio is-focus" name="sl4" checked><span class="lbl">Focus-visible</span></label>
    <label class="row"><input type="radio" class="radio" name="sl5" disabled><span class="lbl">Disabled</span></label>
    <label class="row"><input type="radio" class="radio" name="sl6" disabled checked><span class="lbl">Disabled · selected</span></label>
  </div>
  <div class="group" role="radiogroup" aria-labelledby="pg-l">
    <div class="col-h" id="pg-l">Forma de pagamento · escolha única</div>
    <label class="row"><input type="radio" class="radio" name="pag-l"><span class="lbl">Boleto bancário<small>Compensa em até 2 dias úteis.</small></span></label>
    <label class="row"><input type="radio" class="radio" name="pag-l" checked><span class="lbl">Pix<small>Confirmação imediata pela chave do catálogo.</small></span></label>
    <label class="row"><input type="radio" class="radio" name="pag-l"><span class="lbl">Cartão de crédito</span></label>
  </div>
</div>

<div class="panel dark">
  <div class="panel-head"><span class="marker"></span> Tema escuro</div>
  <div class="group">
    <div class="col-h">Estados</div>
    <label class="row"><input type="radio" class="radio" name="sd"><span class="lbl">Off</span></label>
    <label class="row"><input type="radio" class="radio is-hover" name="sd2"><span class="lbl">Hover</span></label>
    <label class="row"><input type="radio" class="radio" name="sd3" checked><span class="lbl">Selected</span></label>
    <label class="row"><input type="radio" class="radio is-focus" name="sd4" checked><span class="lbl">Focus-visible</span></label>
    <label class="row"><input type="radio" class="radio" name="sd5" disabled><span class="lbl">Disabled</span></label>
    <label class="row"><input type="radio" class="radio" name="sd6" disabled checked><span class="lbl">Disabled · selected</span></label>
  </div>
  <div class="group" role="radiogroup" aria-labelledby="pg-d">
    <div class="col-h" id="pg-d">Forma de pagamento · escolha única</div>
    <label class="row"><input type="radio" class="radio" name="pag-d"><span class="lbl">Boleto bancário<small>Compensa em até 2 dias úteis.</small></span></label>
    <label class="row"><input type="radio" class="radio" name="pag-d" checked><span class="lbl">Pix<small>Confirmação imediata pela chave do catálogo.</small></span></label>
    <label class="row"><input type="radio" class="radio" name="pag-d"><span class="lbl">Cartão de crédito</span></label>
  </div>
</div>

</body></html>
