<!doctype html>
<!-- @dsCard group="Components" name="Components · Toggle" subtitle="Light + dark · uses tokens" viewport="460x320" -->
<html><head><meta charset="utf-8"><title>Toggle</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:'Open Sans',var(--font-sans);padding:24px;transition:background .2s, color .2s;}
  .toolbar{position:fixed;top:12px;right:12px;display:flex;gap:4px;}
  .toolbar button{font:600 11px/1 'Open Sans';padding:6px 10px;border-radius:6px;border:1px solid var(--border-solid);background:var(--card);color:var(--foreground);cursor:pointer;}
  .toolbar button.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);}
  .stack{display:flex;flex-direction:column;gap:14px;max-width:440px;}
  .group{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border-solid);border-radius:12px;background:var(--card);}
  .col-h{font:600 11px/1 'Open Sans';letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 4px;}
  .grp{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0;}
  .tg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border-solid);background:var(--background);box-shadow:var(--shadow-xs);font:600 14px/24px 'Open Sans';color:var(--foreground);}
  .tg.on{border-color:var(--primary);color:var(--primary);}
  .tg.dis{color:var(--muted-foreground);background:var(--secondary);}
  .tg .num{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:19px;border-radius:4px;background:var(--muted-transparent);font-size:12px;line-height:20px;padding:0 5px;color:var(--foreground);}
  .tg.on .num{background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);}
</style></head>
<body>
<div class="toolbar"><button id="bl" class="on">Light</button><button id="bd">Dark</button></div>
<div class="stack">
  <div class="group">
    <div class="col-h">States · primary</div>
    <div class="grp">
      <span class="tg">Default</span>
      <span class="tg on">Selected</span>
      <span class="tg dis">Disabled</span>
    </div>
  </div>
  <div class="group">
    <div class="col-h">With counter</div>
    <div class="grp">
      <span class="tg">Pendentes <span class="num">3</span></span>
      <span class="tg on">Ativos <span class="num">8</span></span>
      <span class="tg">Arquivados <span class="num">12</span></span>
    </div>
  </div>
</div>
<script>
  const r=document.documentElement,bl=document.getElementById('bl'),bd=document.getElementById('bd');
  bl.onclick=()=>{r.classList.remove('dark');r.classList.add('light');bl.classList.add('on');bd.classList.remove('on');}
  bd.onclick=()=>{r.classList.remove('light');r.classList.add('dark');bd.classList.add('on');bl.classList.remove('on');}
</script>
</body></html>
