<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Brand roles" subtitle="Action, canvas, WhatsApp, structure" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Accent family</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tile{border:1px solid var(--border-solid);border-radius:8px;overflow:hidden;}
  .dot{height:52px;display:flex;align-items:center;justify-content:center;color:#070B0D;font-size:11px;font-weight:700;}
  .dot.dark{color:#fff;}
  .fade{padding:8px;font-size:10px;font-weight:700;text-align:center;}
  .meta{padding:6px 8px;font-size:9px;color:var(--foreground-50);font-family:var(--font-numeric);text-align:center;background:var(--muted-solid);}
</style></head>
<body><div class="wrap">
  <div class="tile"><div class="dot" style="background:#F26E22">Ação</div><div class="fade" style="background:#F26E2226;color:#070B0D">CTA e seleção</div><div class="meta">#F26E22</div></div>
  <div class="tile"><div class="dot" style="background:#F0E7DD">Canvas</div><div class="fade" style="background:#F0E7DD;color:#070B0D">Fundo e muted</div><div class="meta">#F0E7DD</div></div>
  <div class="tile"><div class="dot" style="background:#4CDE59">WhatsApp</div><div class="fade" style="background:#4CDE5926;color:#070B0D">Conexão e sucesso</div><div class="meta">#4CDE59</div></div>
  <div class="tile"><div class="dot dark" style="background:#070B0D">Estrutura</div><div class="fade" style="background:#070B0D14;color:#070B0D">Texto e header</div><div class="meta">#070B0D</div></div>
</div></body></html>
