<!doctype html>
<!-- @dsCard group="Brand" name="Illustrations & textures" subtitle="Flat SVGs + dot-pattern textures" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Illustrations</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .tile{border:1px solid var(--border-solid);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);}
  .tile img{height:60px;width:auto;object-fit:contain;}
  .lbl{font-size:10px;color:var(--foreground-50);font-family:var(--font-numeric);letter-spacing:.5px;}
</style></head>
<body><div class="grid">
  <div class="tile"><img src="../assets/images/happy.svg"><div class="lbl">happy</div></div>
  <div class="tile"><img src="../assets/images/angry.svg"><div class="lbl">angry</div></div>
  <div class="tile"><img src="../assets/images/thank.svg"><div class="lbl">thank</div></div>
  <div class="tile"><img src="../assets/images/empty-bag.svg"><div class="lbl">empty-bag</div></div>
  <div class="tile"><img src="../assets/images/green-top-arrow.svg"><div class="lbl">up arrow</div></div>
  <div class="tile"><img src="../assets/images/red-down-arrow.svg"><div class="lbl">down arrow</div></div>
  <div class="tile"><img src="../assets/images/muscular-system-male.svg"><div class="lbl">anatomy · m</div></div>
  <div class="tile"><img src="../assets/images/muscular-system-female.svg"><div class="lbl">anatomy · f</div></div>
  <div class="tile"><img src="../assets/images/bg-profile.svg"><div class="lbl">bg-profile</div></div>
  <div class="tile" style="background:url('../assets/images/dot-pattern-light.png')"><span style="font-size:10px;font-weight:700">dot · light</span><div class="lbl">pattern</div></div>
  <div class="tile" style="background:#070B0D;background-image:url('../assets/images/dot-pattern.png');"><span style="font-size:10px;font-weight:700;color:#fff">dot · dark</span><div class="lbl" style="color:var(--muted-foreground)">pattern</div></div>
</div></body></html>
