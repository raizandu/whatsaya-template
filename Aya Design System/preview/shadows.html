<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows & elevation" subtitle="Flat · xs · dropshadow-lg · alert glow" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--muted-solid);color:var(--foreground);font-family:var(--font-sans);padding:26px;}
  .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .card{width:130px;height:72px;background:#fff;border:1px solid var(--border-solid);border-radius:6px;}
  .k{font-size:11px;color:var(--foreground-75);font-family:var(--font-numeric);text-transform:uppercase;letter-spacing:.5px;}
  .v{font-size:9px;color:var(--foreground-50);font-family:var(--font-numeric);text-align:center;max-width:150px;}
</style></head>
<body><div class="wrap">
  <div class="tile"><div class="card"></div><div class="k">flat</div><div class="v">border only · default card</div></div>
  <div class="tile"><div class="card" style="box-shadow:0 1px 2px rgba(7,11,13,.06)"></div><div class="k">xs</div><div class="v">0 1px 2px / 6%</div></div>
  <div class="tile"><div class="card" style="box-shadow:0 9px 15.4px rgba(7,11,13,.10)"></div><div class="k">dropshadow-lg</div><div class="v">0 9px 15.4px / 10% · signature</div></div>
  <div class="tile"><div class="card" style="box-shadow:0 0 30px 3px rgba(76,222,89,.35)"></div><div class="k">alert glow</div><div class="v">toasts, rare</div></div>
</div></body></html>
