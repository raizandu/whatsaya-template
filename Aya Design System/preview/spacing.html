<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="Tailwind default · 4→48px" viewport="700x280" -->
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:22px;}
  .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border-solid);}
  .row:last-child{border-bottom:none;}
  .k{width:60px;font-size:11px;color:var(--foreground-50);font-family:var(--font-numeric);}
  .v{width:60px;font-size:11px;color:var(--foreground-75);font-family:var(--font-numeric);}
  .bar{height:14px;background:#F26E22;border-radius:2px;}
</style></head>
<body>
  <div class="row"><div class="k">1</div><div class="v">4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="k">2</div><div class="v">8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="k">3</div><div class="v">12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="k">4</div><div class="v">16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="k">5</div><div class="v">20px</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="k">6</div><div class="v">24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="k">8</div><div class="v">32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="k">10</div><div class="v">40px</div><div class="bar" style="width:40px"></div></div>
  <div class="row"><div class="k">12</div><div class="v">48px</div><div class="bar" style="width:48px"></div></div>
</body></html>
