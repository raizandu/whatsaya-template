<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Brand palette" subtitle="The four official Aya colors" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Colors — Brand Primaries</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/regular/rounded.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .swatch{border:1px solid var(--border-solid);border-radius:8px;overflow:hidden;background:var(--card);}
  .block{height:78px;display:flex;align-items:flex-end;padding:10px;color:#070B0D;font-weight:700;font-size:12px;}
  .block.dark{color:#fff;}
  .meta{padding:10px 12px;font-size:11px;display:flex;justify-content:space-between;color:var(--foreground-75);}
  .meta strong{color:var(--foreground);font-size:12px;}
</style></head>
<body>
<div class="wrap">
  <div class="swatch"><div class="block" style="background:#F26E22">Laranja</div>
    <div class="meta"><strong>Ação</strong><span>#F26E22</span></div></div>
  <div class="swatch"><div class="block" style="background:#F0E7DD">Bege</div>
    <div class="meta"><strong>Canvas</strong><span>#F0E7DD</span></div></div>
  <div class="swatch"><div class="block" style="background:#4CDE59">Verde</div>
    <div class="meta"><strong>WhatsApp</strong><span>#4CDE59</span></div></div>
  <div class="swatch"><div class="block dark" style="background:#070B0D">Preto</div>
    <div class="meta"><strong>Estrutura</strong><span>#070B0D</span></div></div>
</div>
</body></html>
