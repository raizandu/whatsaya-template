<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Neutrals" subtitle="Light & dark-mode neutrals" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .sw{border:1px solid var(--border-solid);border-radius:6px;overflow:hidden;}
  .sw .b{height:72px;}
  .sw .m{padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
  .sw .m strong{font-size:12px;font-weight:600;}
  .sw .m span{font-size:10px;color:var(--foreground-50);font-family:var(--font-numeric);}
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="b" style="background:#F0E7DD;border-bottom:1px solid #070B0D1A"></div><div class="m"><strong>background</strong><span>#F0E7DD</span></div></div>
  <div class="sw"><div class="b" style="background:#FFFFFF"></div><div class="m"><strong>card</strong><span>#FFFFFF</span></div></div>
  <div class="sw"><div class="b" style="background:#F0E7DD"></div><div class="m"><strong>muted-solid</strong><span>#F0E7DD</span></div></div>
  <div class="sw"><div class="b" style="background:#070B0D1A"></div><div class="m"><strong>border-solid</strong><span>black · 10%</span></div></div>
  <div class="sw"><div class="b" style="background:#070B0D99"></div><div class="m"><strong>muted-foreground</strong><span>black · 60%</span></div></div>
  <div class="sw"><div class="b" style="background:#070B0D"></div><div class="m"><strong>foreground</strong><span>#070B0D</span></div></div>
  <div class="sw"><div class="b" style="background:#070B0D"></div><div class="m"><strong>bg (dark)</strong><span>#070B0D</span></div></div>
  <div class="sw"><div class="b" style="background:#FFFFFF14"></div><div class="m"><strong>card (dark)</strong><span>white · 8%</span></div></div>
  <div class="sw"><div class="b" style="background:#FFFFFF14"></div><div class="m"><strong>muted (dark)</strong><span>white · 8%</span></div></div>
  <div class="sw"><div class="b" style="background:#FFFFFF33"></div><div class="m"><strong>border (dark)</strong><span>white · 20%</span></div></div>
</div></body></html>
