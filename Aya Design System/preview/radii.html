<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="0 / 4 / 6 / 8 / pill" viewport="700x150" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:22px;}
  .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:90px;height:60px;background:#F26E22;border:1px solid var(--primary);}
  .k{font-size:11px;color:var(--foreground-75);font-family:var(--font-numeric);}
  .v{font-size:10px;color:var(--foreground-50);font-family:var(--font-numeric);}
</style></head>
<body><div class="wrap">
  <div class="tile"><div class="box" style="border-radius:0"></div><div class="k">none</div><div class="v">0px</div></div>
  <div class="tile"><div class="box" style="border-radius:4px"></div><div class="k">inputs</div><div class="v">4px</div></div>
  <div class="tile"><div class="box" style="border-radius:6px"></div><div class="k">default</div><div class="v">6px</div></div>
  <div class="tile"><div class="box" style="border-radius:8px"></div><div class="k">large</div><div class="v">8px</div></div>
  <div class="tile"><div class="box" style="border-radius:9999px"></div><div class="k">pill</div><div class="v">full</div></div>
</div></body></html>
