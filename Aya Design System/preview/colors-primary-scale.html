<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Primary alpha scale" subtitle="10→100 alpha tints used for highlights & rows" viewport="700x140" -->
<html><head><meta charset="utf-8"><title>Primary Tint Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:20px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .cell{aspect-ratio:1/.85;border-radius:6px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;color:#fff;font-weight:600;border:1px solid var(--border-solid);}
  .label{padding-top:10px;font-size:11px;color:var(--foreground-50);letter-spacing:1px;text-transform:uppercase;font-weight:700;}
</style></head>
<body><div class="wrap">
  <div class="label">Primary alpha scale — Aya orange</div>
  <div class="row">
    <div class="cell" style="background:#F26E221A;color:#F26E22">10</div>
    <div class="cell" style="background:#F26E2222;color:#F26E22">20</div>
    <div class="cell" style="background:#F26E2233;color:#F26E22">30</div>
    <div class="cell" style="background:#F26E2244;color:#F26E22">40</div>
    <div class="cell" style="background:#F26E2255">50</div>
    <div class="cell" style="background:#F26E2266">60</div>
    <div class="cell" style="background:#F26E2277">70</div>
    <div class="cell" style="background:#F26E2288">80</div>
    <div class="cell" style="background:#F26E2299">90</div>
    <div class="cell" style="background:#F26E22">100</div>
  </div>
</div></body></html>
