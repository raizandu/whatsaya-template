<!doctype html>
<!-- @dsCard group="Type" name="Type · Display (Aya)" subtitle="Custom Aya font for logo/marketing" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
  .wrap{padding:24px;}
  .row{display:flex;align-items:baseline;gap:18px;padding:10px 0;border-bottom:1px dashed var(--border-solid);}
  .row:last-child{border-bottom:none;}
  .meta{width:180px;color:var(--foreground-50);font-size:11px;font-family:var(--font-numeric);text-transform:uppercase;letter-spacing:.5px;}
  .sample{font-family:var(--font-display);}
</style></head>
<body><div class="wrap">
  <div class="row"><div class="meta">Aya · Bold · 48</div><div class="sample" style="font-size:48px;font-weight:700;">Aya.</div></div>
  <div class="row"><div class="meta">Aya · Regular · 32</div><div class="sample" style="font-size:32px;">Manage your gym.</div></div>
  <div class="row"><div class="meta">Aya · Regular · 20</div><div class="sample" style="font-size:20px;">Check-ins, subscriptions, access.</div></div>
</div></body></html>
