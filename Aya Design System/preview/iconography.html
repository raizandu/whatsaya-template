<!doctype html>
<!-- @dsCard group="Components" name="Iconography · Flaticon UIcons" subtitle="Regular-rounded · used everywhere" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/regular/rounded.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:22px;}
  .wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:12px 16px;}
  .icon{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px;color:var(--foreground-50);font-family:var(--font-numeric);text-align:center;}
  .icon i{font-size:22px;color:var(--foreground);}
  h4{grid-column:1/-1;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--foreground-50);margin:4px 0;font-weight:700;}
</style></head>
<body><div class="wrap">
  <h4>Flaticon UIcons · Regular-Rounded (fi fi-rr-*)</h4>
  <div class="icon"><i class="fi fi-rr-home"></i>home</div>
  <div class="icon"><i class="fi fi-rr-users-alt"></i>users</div>
  <div class="icon"><i class="fi fi-rr-user"></i>user</div>
  <div class="icon"><i class="fi fi-rr-calendar"></i>calendar</div>
  <div class="icon"><i class="fi fi-rr-check"></i>check</div>
  <div class="icon"><i class="fi fi-rr-cross-small"></i>close</div>
  <div class="icon"><i class="fi fi-rr-plus"></i>add</div>
  <div class="icon"><i class="fi fi-rr-search"></i>search</div>
  <div class="icon"><i class="fi fi-rr-bell"></i>bell</div>
  <div class="icon"><i class="fi fi-rr-settings"></i>settings</div>
  <div class="icon"><i class="fi fi-rr-dollar"></i>money</div>
  <div class="icon"><i class="fi fi-rr-barcode-scan"></i>scan</div>
  <div class="icon"><i class="fi fi-rr-lock"></i>lock</div>
  <div class="icon"><i class="fi fi-rr-envelope"></i>email</div>
  <div class="icon"><i class="fi fi-rr-chart-histogram"></i>chart</div>
  <div class="icon"><i class="fi fi-rr-clock"></i>clock</div>
  <div class="icon"><i class="fi fi-rr-menu-burger"></i>menu</div>
  <div class="icon"><i class="fi fi-rr-arrow-right"></i>arrow</div>
  <div class="icon"><i class="fi fi-rr-star"></i>star</div>
  <div class="icon"><i class="fi fi-rr-heart"></i>heart</div>
</div></body></html>
